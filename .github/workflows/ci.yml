# The gate: each job runs a Makefile target, which loops over the root module
# and every extractor and renderer module (separate go.mod files ./... never
# reaches). Lint runs in lint.yaml.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
# When a new revision is pushed to a PR, cancel all in-progress CI runs for that
# PR. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOFLAGS: "-trimpath"
  # go.mod's version, from setup-go; never a silent toolchain download.
  GOTOOLCHAIN: local
jobs:
  tidy:
    name: go mod tidy is committed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: "**/go.sum"
    # go mod tidy -diff, in every module: prints the change and fails.
    - run: make tidy

  test:
    name: Unit tests (vet, race)
    runs-on: ubuntu-latest
    # cgo (tree-sitter) compiles with the runner's gcc. The ceiling is against a
    # hung test, not a target.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: "**/go.sum"
    - name: Vet and test every module
      run: make test
    - name: Race detector, every module
      run: make race
    - name: Coverage report (root module)
      run: |
        go test -coverprofile=coverage.out -covermode=atomic ./...
        go tool cover -func=coverage.out | tail -1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: coverage
        path: coverage.out
        retention-days: 7

  architecture:
    name: Architecture gate and rendering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The gate refuses a baseline loosened in the same change as code: re-record
    # anarch-baseline.json in a pull request of its own, after review.
    permissions:
      contents: read
    env:
      # anarch-lint has no tags yet, so `go run module@commit` fails on Go's
      # deprecation lookup; build it from a pinned commit instead.
      ANARCH_LINT_REF: 59ecc043c1530bdcb34ebfdaeafdb5bbcc592385
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # A pull request's gate counts only the findings on lines it changed,
        # which needs the base branch's history.
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: StevenACoffman/anarch-lint
        ref: ${{ env.ANARCH_LINT_REF }}
        path: .anarch-lint
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: "**/go.sum"
    - name: Build anarch-lint
      run: cd .anarch-lint && go build -o "$RUNNER_TEMP/anarch-lint" .
    - name: Check the architecture against the baseline
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ -n "$BASE_REF" ]; then
          "$RUNNER_TEMP/anarch-lint" check --new-from-rev "origin/$BASE_REF"
        else
          "$RUNNER_TEMP/anarch-lint" check
        fi
    - name: Check that anarch.md renders from the model
      if: always()
      run: '"$RUNNER_TEMP/anarch-lint" render --check'

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: "**/go.sum"
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
    - name: govulncheck, every module
      run: make vuln
