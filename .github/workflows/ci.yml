# The full gate: make check over the root module and every extractor module.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cgo (tree-sitter) needs a C toolchain; ubuntu-latest ships gcc.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      # Built with this job's Go: a golangci-lint binary built by an older Go
      # cannot read the newer export data and fails to type-check.
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: make check
        run: make check
