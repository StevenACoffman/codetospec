"""
A profile the AI keeps for a learner.
"""
type AIProfile implements Profile @key(fields: "id") {
  id: ID!
  summary: String
}

"""Anything that describes a learner."""
interface Profile {
  id: ID!
}

type RowByTeacher @key(fields: "teacherID kaLocale") {
  teacherID: ID!
  kaLocale: String!
}

extend type Mutation {
  blockEmail(email: String!): Boolean
  devadminAddAuthEmail(kaid: String!, authEmail: String!): Boolean
}
