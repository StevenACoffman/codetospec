apiVersion: api.cerbos.dev/v1
metadata:
    annotations:
        subject:Mutation.editBio: arg:kaid
        subject:User.emails: parent:Kaid
resourcePolicy:
    resource: users
    version: default
    rules:
        - name: allow-guarded
          actions:
            - Mutation.editBio
            - Mutation.notify
            - Query.cdi
            - Query.cdiAlias
            - Query.things
            - Query.udi
            - User.emails
          effect: EFFECT_ALLOW
          roles:
            - anonymous
            - push
            - service
            - user
        - name: open-access
          actions:
            - Query.time
          effect: EFFECT_ALLOW
          roles:
            - anonymous
            - push
            - service
            - user
        - name: rule.user.authz-bio
          actions:
            - Mutation.editBio
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!(("internal_user" in P.attr.attributes && !("deleted" in R.attr.attributes) && "bio_flag" in R.attr.requestAttributes && P.attr.grants.exists(g, g.capability == "can_view_user_identity" && g.locale == R.attr.locale) && P.attr.grants.exists(g, g.capability == "can_view_user_identity" && g.explicit == true) && "managing_coach_of" in R.attr.subjectRelations))'
        - name: rule.hook.authz-notify
          actions:
            - Mutation.notify
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!("push" in P.roles)'
        - name: rule.class.authz-cdi
          actions:
            - Query.cdi
            - Query.cdiAlias
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!("teacher_of" in R.attr.relations)'
        - name: rule.district.authz-udi
          actions:
            - Query.udi
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!(("service" in P.roles || P.attr.grants.exists(g, g.capability == "can_view_user_identity" && g.userKind == "all") || P.attr.grants.exists(g, g.capability == "can_view_user_identity" && g.userKind == "nwea-map")))'
        - name: rule.user.authz-emails
          actions:
            - User.emails
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: (!(R.attr.subject == P.id) && !(P.attr.grants.exists(g, g.capability == "can_view_user_identity" && (g.userKind == "all" || (g.userKind == "nwea-map" && R.attr.kmapDistrictOwned == true)))))
