apiVersion: api.cerbos.dev/v1
metadata:
    annotations:
        subject:User.emails: parent:Kaid
resourcePolicy:
    resource: users
    version: default
    rules:
        - name: allow-guarded
          actions:
            - Mutation.notify
            - Query.cdi
            - Query.cdiAlias
            - Query.things
            - Query.udi
            - User.emails
          effect: EFFECT_ALLOW
          roles:
            - anonymous
            - push
            - service
            - user
        - name: open-access
          actions:
            - Query.time
          effect: EFFECT_ALLOW
          roles:
            - anonymous
            - push
            - service
            - user
        - name: rule.hook.authz-notify
          actions:
            - Mutation.notify
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!("push" in P.roles)'
        - name: rule.class.authz-cdi
          actions:
            - Query.cdi
            - Query.cdiAlias
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!("teacher_of" in R.attr.relations)'
        - name: rule.district.authz-udi
          actions:
            - Query.udi
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!(("service" in P.roles || P.attr.grants.exists(g, g.capability == "can_view_user_identity" && g.userKind == "all") || P.attr.grants.exists(g, g.capability == "can_view_user_identity" && g.userKind == "nwea-map")))'
        - name: rule.user.authz-emails
          actions:
            - User.emails
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: (!(R.attr.subject == P.id) && !(P.attr.grants.exists(g, g.capability == "can_view_user_identity" && (g.userKind == "all" || (g.userKind == "nwea-map" && R.attr.kmapDistrictOwned == true)))))
