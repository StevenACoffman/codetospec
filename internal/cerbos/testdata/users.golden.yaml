apiVersion: api.cerbos.dev/v1
metadata:
    annotations:
        obligation:Mutation.notify: rate_limit ratelimit.ByIP key=Notify count=10 window=60 * time.Second
        subject:Mutation.editBio: arg:kaid
        subject:Mutation.transfer: arg:from
        subject:User.emails: parent:Kaid
        subject2:Mutation.transfer: arg:to
resourcePolicy:
    resource: users
    version: default
    rules:
        - name: allow-guarded
          actions:
            - Query.cdi
            - Query.cdiAlias
            - Query.things
          effect: EFFECT_ALLOW
          roles:
            - anonymous
            - push
            - service
            - user
        - name: open-access
          actions:
            - Query.time
          effect: EFFECT_ALLOW
          roles:
            - anonymous
            - push
            - service
            - user
        - name: allow-push
          actions:
            - Mutation.notify
          effect: EFFECT_ALLOW
          roles:
            - push
        - name: allow-service-user
          actions:
            - Query.udi
          effect: EFFECT_ALLOW
          roles:
            - service
            - user
        - name: allow-user
          actions:
            - Mutation.editBio
            - Mutation.transfer
            - User.emails
          effect: EFFECT_ALLOW
          roles:
            - user
        - name: rule.user.authz-bio
          actions:
            - Mutation.editBio
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!(("internal_user" in P.attr.attributes && !("deleted" in R.attr.attributes) && "bio_flag" in R.attr.requestAttributes && P.attr.grants.exists(g, g.capability == "can_view_user_identity" && (g.locale == R.attr.locale || g.locale == "*")) && P.attr.grants.exists(g, g.capability == "can_view_user_identity" && g.explicit == true) && "managing_coach_of" in R.attr.subjectRelations))'
        - name: rule.hook.authz-notify
          actions:
            - Mutation.notify
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!("push" in P.roles)'
        - name: rule.user.authz-transfer-from
          actions:
            - Mutation.transfer
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!(R.attr.subject == P.id)'
        - name: rule.user.authz-transfer-to
          actions:
            - Mutation.transfer
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: (!(R.attr.subject2 == P.id) && !(P.id in R.attr.coaches2))
        - name: rule.class.authz-cdi
          actions:
            - Query.cdi
            - Query.cdiAlias
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!("teacher_of" in R.attr.relations)'
        - name: rule.district.authz-udi
          actions:
            - Query.udi
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: '!(("service" in P.roles || P.attr.grants.exists(g, g.capability == "can_view_user_identity" && (g.locale == R.attr.locale || g.locale == "*") && ("Video" in g.contentKinds || "*" in g.contentKinds)) || P.attr.grants.exists(g, g.capability == "can_view_user_identity" && g.userKind == "all") || P.attr.grants.exists(g, g.capability == "can_view_user_identity" && g.userKind == "nwea-map")))'
        - name: rule.user.authz-emails
          actions:
            - User.emails
          effect: EFFECT_DENY
          roles:
            - '*'
          condition:
            match:
                expr: (!(R.attr.subject == P.id) && !(P.attr.grants.exists(g, g.capability == "can_view_user_identity" && (g.userKind == "all" || (g.userKind == "nwea-map" && R.attr.kmapDistrictOwned == true)))))
